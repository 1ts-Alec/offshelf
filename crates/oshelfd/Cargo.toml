[package]
name = "oshelfd"
description = "Offshelf server: stores encrypted chunks and the encrypted manifest on a Pi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oshelf-core.workspace = true
blake3.workspace = true
hex.workspace = true
rand.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
