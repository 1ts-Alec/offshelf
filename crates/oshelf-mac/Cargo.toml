[package]
name = "oshelf-mac"
description = "The Mac app's engine: NFS loopback mount, chunk cache, offload and host switching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "oshelf_mac"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "oshelf-mount"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
oshelf = { path = "../oshelf" }
oshelf-core.workspace = true
hex.workspace = true
anyhow = "1"
libc = "0.2"
ureq = "2"
async-trait = "0.1"
nfsserve = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.29", features = ["cli"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"

[dev-dependencies]
oshelfd = { path = "../oshelfd" }
tempfile = "3"
axum = "0.8"
