name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm run wasm
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist

  build:
    needs: [test, web]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - run: cargo build --release --target ${{ matrix.target }} -p oshelfd --features web
      - uses: actions/upload-artifact@v4
        with:
          name: oshelfd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oshelfd

  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Mac app
        run: |
          xcodebuild -project apps/macos/Offshelf.xcodeproj -scheme Offshelf \
            -configuration Release -derivedDataPath apps/macos/build/dd \
            CODE_SIGNING_ALLOWED=NO build
