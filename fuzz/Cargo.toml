[package]
name = "oshelf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ed25519-dalek = "2"
oshelf-core = { path = "../crates/oshelf-core" }

[[bin]]
name = "chunk_open"
path = "fuzz_targets/chunk_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_span"
path = "fuzz_targets/range_span.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signatures"
path = "fuzz_targets/signatures.rs"
test = false
doc = false
bench = false
