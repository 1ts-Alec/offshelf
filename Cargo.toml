[workspace]
resolver = "2"
members = ["crates/oshelf-core", "crates/oshelfd", "crates/oshelf", "crates/oshelf-mac"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/1ts-Alec/offshelf"

[workspace.dependencies]
oshelf-core = { path = "crates/oshelf-core" }
blake3 = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
hex = "0.4"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
